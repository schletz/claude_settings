extends: default
font:
  catalog:
    merge: true
    # Sans serif font for the headings, bundled with asciidoctor-pdf (same family as Noto Serif).
    Noto Sans:
      normal: GEM_FONTS_DIR/notosans-regular-subset.ttf
      bold: GEM_FONTS_DIR/notosans-bold-subset.ttf
      italic: GEM_FONTS_DIR/notosans-italic-subset.ttf
      bold_italic: GEM_FONTS_DIR/notosans-bold_italic-subset.ttf
heading:
  # Sans serif, bold and dark blue, so every level up to h4 stands out from the serif body text (10.5pt)
  # on a black and white printout.
  font_family: Noto Sans
  font_style: bold
  font_color: 1F3864
  # h1 is used for part titles (book doctype) or the doctitle (article doctype)
  h1_font_size: 20
  # h2 is used for chapter titles (book doctype only); the rule below marks the start of each task.
  h2_font_size: 16
  h2_border_width: [0, 0, 0.75, 0]
  h2_border_color: 1F3864
  h2_padding: [0, 0, 3, 0]
  h3_font_size: 13.5
  h4_font_size: 11.5
  h5_font_size: $base_font_size
  h6_font_size: $base_font_size_small
code:
  font_size: ceil($base_font_size * 0.8)
  line_height: 1.15
list:
  item_spacing: $vertical_rhythm / 6
table:
  cell_padding: 1.3  
footer:
  recto:
    left:
      content: 
    right:
      content: '{page-number} von {page-count}'
  verso:
    left:
      content: 
    right:
      content: '{page-number} von {page-count}'

